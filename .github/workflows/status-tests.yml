# Offline unit tests for the ecosystem status generator (no network, stdlib only).
name: status-tests
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - "status/producers.json"
      - ".github/workflows/status-tests.yml"
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s .github/scripts/tests -v
