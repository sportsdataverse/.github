name: Star history

# Reusable workflow: renders the calling repo's star history chart and pushes it
# to that repo's orphan `star-history` branch. READMEs embed the files from
# raw.githubusercontent.com, so this never commits to a (protected) main, never
# fights a README.Rmd re-knit, and the absolute URLs render on CRAN, PyPI and npm.
#
# Why self-rendered: since 2026-06-30 GitHub limits the stargazers API to a
# repo's own admins/collaborators, which blanked hosted star-history embeds. The
# repo's own GITHUB_TOKEN still qualifies.
#
# The third-party renderer (and the npm packages it installs) runs in a job with
# a read-only token; only the publish job, which runs first-party code, can write.
#
# Caller (.github/workflows/star-history.yml in each library):
#   on: { schedule: [{cron: '17 6 * * *'}], watch: {types: [started]}, workflow_dispatch: }
#   permissions: { contents: write }
#   jobs: { star-history: { uses: sportsdataverse/.github/.github/workflows/star-history.yml@main } }

on:
  workflow_call:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.chart.outputs.changed }}
    steps:
      # Start from the published chart so the action's .star-history.sig change
      # detection works and unchanged runs publish nothing. Anonymous fetch: the
      # libraries are public, and no credential lands where the renderer can read it.
      - name: Fetch the published chart
        env:
          REPO: ${{ github.repository }}
        run: |
          git init -q out
          git -C out remote add origin "https://github.com/${REPO}.git"
          rc=0
          git -C out ls-remote --exit-code --heads origin star-history > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git -C out fetch -q --depth 1 origin star-history
            git -C out checkout -q FETCH_HEAD
          elif [ "$rc" != 2 ]; then
            exit "$rc"  # 2 = branch absent (first run); anything else is a real failure
          fi

      - name: Render chart
        id: chart
        uses: keeptinkering/star-history-action@12543ab7352b91fb7c5eb0c4fbb39772baa0c168 # v1.0.6
        with:
          output-dir: out
          update-readme: 'false'
          commit: 'false'

      - name: Upload chart
        if: steps.chart.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: star-history
          path: |
            out/*.svg
            out/*.png
            out/.star-history.sig
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: star-history-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the star-history branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init -q out
          cd out
          git remote add origin "https://github.com/${REPO}.git"
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          rc=0
          git ls-remote --exit-code --heads origin star-history > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch -q --depth 1 origin star-history
            git checkout -q -b star-history FETCH_HEAD
          elif [ "$rc" = 2 ]; then
            git checkout -q --orphan star-history
          else
            exit "$rc"
          fi

      - name: Download chart
        uses: actions/download-artifact@v8
        with:
          name: star-history
          path: out

      - name: Push chart
        working-directory: out
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Chart already published.'
            exit 0
          fi
          git commit -q -m 'chore: update star history [skip ci]'
          git push -q origin HEAD:star-history
